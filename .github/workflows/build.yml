name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BlackCatPomodoro.sln

      - name: Build
        run: dotnet build BlackCatPomodoro.sln -c Release --no-restore

      - name: Test
        run: dotnet test BlackCatPomodoro.sln -c Release --no-build
